name: Publication checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check public files and history
        run: python3 scripts/publication_policy.py --all-history
      - name: Test publication and packaging boundaries
        run: python3 -m unittest discover -s Tests/Tooling -p 'test_*.py'
